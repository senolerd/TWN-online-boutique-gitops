"apiVersion": "gateway.networking.k8s.io/v1"
"kind": "Gateway"
"metadata":
  "annotations": {}
  "name": "public-gw"
  "namespace": "gateway-system"
"spec":
  "gatewayClassName": "aws-alb"
  "infrastructure":
    "parametersRef":
      "group": "gateway.k8s.aws"
      "kind": "LoadBalancerConfiguration"
      "name": "public-alb"
  "listeners":
  - "allowedRoutes":
      "namespaces":
        "from": "All"
    "name": "http"
    "port": 80
    "protocol": "HTTP"
