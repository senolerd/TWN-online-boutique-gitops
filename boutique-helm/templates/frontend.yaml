apiVersion: apps/v1
kind: Deployment
metadata:
  name: "frontend-deployment"
  labels:
    app: "frontend"
spec:
  replicas: {{ .Values.frontend.replica }}
  selector:
    matchLabels:
      app: "frontend"
  template:
    metadata:
      labels:
        app: "frontend"
    spec:
      containers:
      - name: "frontend"
        image: "{{ .Values.frontend.imguri }}"
        ports:
        - containerPort: {{ .Values.frontend.port }}
        env:
        - name: PORT
          value: "{{ .Values.frontend.port }}"
        - name: FRONTEND_SERVICE_ADDR
          value: "frontend:8080"
        - name: REDIS_ADDR
          value: "redis-cart:6379"
        - name: ENABLE_SHOPPING_ASSISTANT
          value: "false"
        - name: DISABLE_PROFILER
          value: "1"
        - name: DISABLE_TRACING
          value: "1"
        - name: DISABLE_DEBUGGER
          value: "1"
        - name: GCP_PROJECT
          value: "hello"
        - name: GOOGLE_CLOUD_PROJECT
          value: "world"
---
apiVersion: v1
kind: Service
metadata:
  name: "frontend"
spec:
  selector:
    app: "frontend"
  ports:
  - protocol: TCP
    port: {{ .Values.frontend.port }}
    targetPort: {{ .Values.frontend.port }}
