apiVersion: apps/v1
kind: Deployment
metadata:
  name: "adservice-deployment"
  labels:
    app: "adservice"
spec:
  replicas: {{ .Values.adservice.replica }}
  selector:
    matchLabels:
      app: "adservice"
  template:
    metadata:
      labels:
        app: "adservice"
    spec:
      containers:
      - name: "adservice"
        image: "{{ .Values.adservice.imguri }}"
        ports:
        - containerPort: {{ .Values.adservice.port }}
        env:
        - name: PORT
          value: "{{ .Values.adservice.port }}"
        - name: AD_SERVICE_ADDR
          value: "{{ .Values.adservice.name }}:{{ .Values.adservice.port }}"
        - name: REDIS_ADDR
          value: "redis-cart:6379"
        - name: ENABLE_SHOPPING_ASSISTANT
          value: "false"
        - name: DISABLE_PROFILER
          value: "1"
        - name: DISABLE_TRACING
          value: "1"
        - name: DISABLE_DEBUGGER
          value: "1"
        - name: REGION
          value: "us-east-1"
        - name: PROJECT_ID
          value: "hello1"
        - name: GCP_PROJECT
          value: "hello2"
        - name: GOOGLE_CLOUD_PROJECT
          value: "hello3"
---
apiVersion: v1
kind: Service
metadata:
  name: "adservice"
spec:
  selector:
    app: "adservice"
  ports:
  - protocol: TCP
    port: {{ .Values.adservice.port }}
    targetPort: {{ .Values.adservice.port }}
