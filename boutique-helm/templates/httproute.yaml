apiVersion: "gateway.networking.k8s.io/v1"
kind: HTTPRoute
metadata:
    name: "boutique-httproute"
    annotations: 
        "argocd.argoproj.io/sync-wave": "20" 
spec:
    hostnames: 
        - "boutique.senolerd.xyz"
    parentRefs: 
        - group: "gateway.networking.k8s.io"
          kind : "Gateway"
          name : "public-gw"
          namespace: "gateway-system"
    rules:
        - matches: 
            - path: 
                type: "PathPrefix"
                value: "/" 
              backendRefs:
              - name: frontend
                port: 8080
                group: ""
                kind: "Service"
                weight: 1
