"apiVersion": "gateway.networking.k8s.io/v1"
"kind": "HTTPRoute"
"metadata":
  "annotations":
    "argocd.argoproj.io/sync-wave": "20"
  "name": "boutique-prod"
"spec":
  "hostnames":
  - "boutique.banupaints.com"
  "parentRefs":
  - "group": "gateway.networking.k8s.io"
    "kind": "Gateway"
    "name": "public-gw"
    "namespace": "gateway-system"
  "rules":
  - "backendRefs":
    - "group": ""
      "kind": "Service"
      "name": "frontend"
      "port": 8080
      "weight": 1
    "matches":
    - "path":
        "type": "PathPrefix"
        "value": "/"
