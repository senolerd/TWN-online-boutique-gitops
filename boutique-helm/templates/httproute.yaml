"apiVersion": "gateway.networking.k8s.io/v1"
"kind": "HTTPRoute"
"metadata":
  "name": "boutique-prod"
"spec":
  "parentRefs":
  - "name": "public-gw"
    "namespace": "gateway-system"
  "rules":
  - "backendRefs":
    - "name": "frontend"
      "port": 8080
    "matches":
    - "path":
        "type": "PathPrefix"
        "value": "/"
