apiVersion: argoproj.io/v1alpha1
kind: Application 
metadata:
  name: boutique 
  namespace: argocd 
  annotations:
    argocd.argoproj.io/sync-wave: "999"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default 
  source:
    repoURL: https://github.com/senolerd/TWN-online-boutique-gitops.git
    path: boutique-helm
    targetRevision: HEAD
  destination:
    namespace: default
    name: in-cluster 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true 
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
